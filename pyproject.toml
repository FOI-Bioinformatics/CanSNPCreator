[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "CanSNPCreator"
description = "Extraction, evaluation and export of canonical SNPs from whole genome alignments"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andreas Sjödin" }]
keywords = ["bioinformatics", "canSNP", "genomics", "typing"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["mypy>=2.1,<3", "pytest>=7", "pytest-cov>=5", "ruff>=0.15,<0.16"]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/CanSNPCreator"
Issues = "https://github.com/FOI-Bioinformatics/CanSNPCreator/issues"

[project.scripts]
# One script only. A lowercase alias beside it is the same file on a
# case-insensitive filesystem, which macOS uses by default, and reinstalling
# over an earlier install then fails while removing it.
CanSNPCreator = "cansnpscorer.cansnp_scorer:main"

[tool.setuptools]
packages = ["cansnpscorer", "cansnpscorer.helpers"]

[tool.setuptools.dynamic]
version = { attr = "cansnpscorer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cansnpscorer"]
branch = true

[tool.coverage.report]
# Line and branch coverage together, measured with the contract tests running,
# was 93% when this floor was set.
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "FURB", "RUF"]
# E501 is covered by line-length alone; PERF401 would turn loops that append
# one long message each into harder-to-read comprehensions.
ignore = ["E501", "PERF401"]

[tool.mypy]
python_version = "3.13"
files = ["cansnpscorer"]
warn_unused_ignores = true
warn_redundant_casts = true
